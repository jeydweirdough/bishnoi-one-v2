version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      next-react:
        patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom", "@next/*"]
      tooling:
        patterns: ["eslint", "@eslint/*", "typescript", "typescript-eslint", "turbo", "vitest", "tailwindcss", "@tailwindcss/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
